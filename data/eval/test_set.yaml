policy_cases:
  - description: "Manager, travel, over limit"
    rule_id: finance_travel_limit
    level: Manager
    value: 1500
    expected_action: auto_reject

  - description: "Manager, travel, within limit"
    rule_id: finance_travel_limit
    level: Manager
    value: 900
    expected_action: auto_approve

  - description: "Director, meals, over limit"
    rule_id: finance_meals_limit
    level: Director
    value: 150
    expected_action: auto_reject

  - description: "Undefined level, forces escalation"
    rule_id: finance_travel_limit
    level: Intern
    value: 100
    expected_action: human_approval
    policy_context: "Travel reimbursement limits are defined per employee level: Associate $500, Senior Associate $750, Manager $1200, Senior Manager $2000, Director $3500. No limit is defined for Intern-level employees."
    situation: "An Intern submitted a $100 travel expense claim. No policy limit exists for the Intern level."